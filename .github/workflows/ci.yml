name: CI - Build & Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    uses: ./.github/workflows/set_matrix.yml

  test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - name: echo matrix
        run: echo ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

  build-and-test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    if: github.base_ref
    strategy:
      matrix:
        IMAGE_DIR: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "${{ matrix.IMAGE_DIR }}/Dockerfile"
          config: "${{ matrix.IMAGE_DIR }}/hadolint_conf.yml"

      - name: Convert Repository Name to Lowercase
        id: lowercased-owner
        uses: ./.github/workflows/composite_actions/get_lower_case_owner

      - name: Determine Cache Source
        id: cache-source
        uses: ./.github/workflows/composite_actions/determine_cache  # ✅ Calls the cache action
        with:
          image_dir: ${{ matrix.IMAGE_DIR }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.IMAGE_DIR }}
          tags: ${{ matrix.IMAGE_DIR }}:test
          cache-from: type=registry,ref=${{ steps.cache-source.outputs.cache_from }}
          cache-to: type=inline
          load: true

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ matrix.IMAGE_DIR }}:test
          trivy-config: ${{ matrix.IMAGE_DIR }}/trivy_conf.yml
  
      - name: Analyze Image with Dive
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock wagoodman/dive:latest  ${{ matrix.IMAGE_DIR }}:test --ci