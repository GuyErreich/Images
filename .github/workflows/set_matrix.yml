name: Set Matrix
on:
  workflow_call:
    outputs:
      matrix:
        description: "The generated matrix"
        value: ${{ jobs.generate-matrix.outputs.matrix }}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Matrix from YAML
        id: read-matrix 
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            const matrix = yaml.load(fs.readFileSync('./resources/matrix.yml', 'utf8'));
            console.log(JSON.stringify(matrix.images));