name: Auto Tagging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to tag'
        required: true
        type: choice
        options:
          - dev
          - stagging
          - master
  push:
  pull_request:
    branches:
      - dev
      - stagging
      - master
    types:
      - closed

env:
  REF: ${{ github.base_ref || github.event.inputs.ref || 'dev'}}
  

jobs:
  generate-matrix:
    uses: ./.github/workflows/set_matrix.yml

  generate-tags:
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        IMAGE_DIR: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to fetch all tags

      - name: Generate Next Version
        id: generate-version
        uses: ./.github/workflows/composite_actions/generate_version
        with:
          image_name: ${{ matrix.IMAGE_DIR }}
          base_ref: ${{ env.REF }}
        
      - name: Create and Push Tag
        if: ${{ steps.generate-version.outputs.new_tag }} != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag  ${{ steps.generate-version.outputs.new_tag }}
          git push origin  ${{ steps.generate-version.outputs.new_tag }}