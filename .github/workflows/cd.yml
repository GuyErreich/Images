name: CD - Publish Docker Images

on:
  create:
  # workflow_run:
  #   workflows: ["Auto Tagging"]
  #   types:
  #     - completed
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.repository.environment }}



jobs:
  print-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Print Ref
        run: |
          echo "Ref: ${{ github.ref_name }}"
          echo "ref type: ${{ github.ref_type }}"
          echo "ref: ${{ github.ref }}"
          echo "event name: ${{ github.event_name }}"
          echo "event: ${{ fromJson(github.event) }}"

  generate-matrix:
    uses: ./.github/workflows/set_matrix.yml
  
  publish-image:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        IMAGE_DIR: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    if: github.ref_type == 'tag' && github.ref_name =~ '^(${{ needs.generate-matrix.outputs.matrix }})-v[0-9]+\.[0-9]+\.[0-9]+(-dev|-staging)?$'
    environment: 
      name: ${{ github.ref_name == 'stagging' && 'stagging' || github.ref_name == 'dev' && 'development' || 'delivery' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Current Workflow Tag
        run: |
          case "${{ github.event.repository.environment }}" in
            *dev*) LATEST_TAG="dev" ;;
            *staging*) LATEST_TAG="staging" ;;
            *) LATEST_TAG="latest" ;;
          esac

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using latest tag: $LATEST_TAG"

      - name: Get lowercased repository owner
        id: lowercased-owner
        uses: ./.github/workflows/composite_actions/get_lower_case_owner

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.IMAGE_DIR }}
          tags: |
            ghcr.io/${{ steps.lowercased-owner.outputs.repo_owner }}/${{ matrix.IMAGE_DIR }}:${{ github.ref_name }}
            ghcr.io/${{ steps.lowercased-owner.outputs.repo_owner }}/${{ matrix.IMAGE_DIR }}:${{ env.LATEST_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.lowercased-owner.outputs.repo_owner }}/${{ matrix.IMAGE_DIR }}:${{ env.LATEST_TAG }}
          cache-to: type=inline
          push: true