schemaVersion: 2.0.0

globalEnvVars:
  - key: "WORKDIR"
    value: "/app"
  - key: "OUTPUT_FILE"
    value: "$WORKDIR/temp/nginx.conf"


metadataTest:
  envVars:
    - key: OPENRESTY_INSTALL_FOLDER
      value: "/usr/local/openresty"
  exposedPorts: ["3128"]
  entrypoint: [ "./entrypoint.py", "--template-dir", "templates", "--template-file", "nginx.conf", "--output-file", "$OUTPUT_FILE" ]
  workdir: "/app"


fileExistenceTests:
  - name: "entrypoint.py"
    path: "$WORKDIR/entrypoint.py"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "nginx.conf template"
    path: "$WORKDIR/templates/nginx.conf"
    shouldExist: true
    permissions: "-rw-r--r--"

  - name: "nginx.conf"
    path: "$OUTPUT_FILE"
    shouldExist: true
    permissions: "-rw-r--r--"



commandTests:
  - name: "Run entrypoint.py with test args"
    command: "$WORKDIR/entrypoint.py"
    args: [
      "--resolver", "8.8.8.8",
      "--port", "3128",
      "--allowed-upstreams", "169.254.170.2,192.168.1.2",
      "--server-names", "api.github.com,github.com,*.actions.githubusercontent.com",
      "--template-dir", "/app/templates",
      "--template-file", "nginx.conf",
      "--output-file", "$OUTPUT_FILE",
      "--cmd", "echo", "'Testing entrypoint.py conf generation'"
    ]
    exitCode: 0


fileContentTests:
  - name: "Check if nginx.conf contains correct resolver"
    path: "$OUTPUT_FILE"
    expectedContents: 
      - "resolver 8.8.8.8"

  - name: "Check if nginx.conf has correct port"
    path: "$OUTPUT_FILE"
    expectedContents: 
      - "listen 3128;"

  - name: "Check if nginx.conf includes upstream IPs"
    path: "$OUTPUT_FILE"
    expectedContents: 
      - '["169.254.170.2"] = true,'
      - '["192.168.1.2"] = true,'

  - name: "Check if nginx.conf includes server names"
    path: "$OUTPUT_FILE"
    expectedContents: 
      - "server_name api.github.com;"
      - "server_name github.com;"
      - "server_name *.actions.githubusercontent.com;"
