schemaVersion: 2.0.0

globalEnvVars:
  - key: "WORKDIR"
    value: "/app"


metadataTest:
  envVars:
    - key: OPENRESTY_INSTALL_FOLDER
      value: "/usr/local/openresty"
  exposedPorts: ["3128"]
  entrypoint: [ "./entrypoint.py", "--template-dir", "templates", "--template-file", "nginx.conf", "--output-file", "/usr/local/openresty/nginx/conf/nginx.conf" ]
  workdir: "$WORKDIR"


fileExistenceTests:
  - name: "entrypoint.py"
    path: "$WORKDIR/entrypoint.py"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "nginx.conf template"
    path: "$WORKDIR/templates/nginx.conf"
    shouldExist: true
    permissions: "-rw-r--r--"

  - name: "nginx.conf"
    path: "/usr/local/openresty/nginx/conf/nginx.conf"
    shouldExist: true
    permissions: "-rw-r--r--"



commandTests:
  - name: "Run entrypoint.py with test args"
    command: "$WORKDIR/entrypoint.py"
    args: ["--resolver", "8.8.8.8",
           "--port", "3128",
           "--allowed-upstreams", "169.254.170.2,192.168.1.2",
           "--server-names", "api.github.com,github.com,*.actions.githubusercontent.com",
           "--template-dir", "$WORKDIR/templates",
           "--template-file", "nginx.conf",
           "--output-file", "/usr/local/openresty/nginx/conf/nginx.conf",
           "--cmd", "[echo, 'Testing entrypoint.py conf generation']"]
    exitCode: 0


fileContentTests:
  - name: "Check if nginx.conf contains correct resolver"
    path: "/usr/local/openresty/nginx/conf/nginx.conf"
    expectedContents: 
      - "resolver 8.8.8.8"

  - name: "Check if nginx.conf has correct port"
    path: "/usr/local/openresty/nginx/conf/nginx.conf"
    expectedContents: 
      - "listen 3128;"

  - name: "Check if nginx.conf includes upstream IPs"
    path: "/usr/local/openresty/nginx/conf/nginx.conf"
    expectedContents: 
      - '["169.254.170.2"] = true,'
      - '["192.168.1.2"] = true,'

  - name: "Check if nginx.conf includes server names"
    path: "/usr/local/openresty/nginx/conf/nginx.conf"
    expectedContents: 
      - "server_name api.github.com;"
      - "server_name github.com;"
      - "server_name *.actions.githubusercontent.com;"
